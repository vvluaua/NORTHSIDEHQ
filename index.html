  marketing:renderMarketing, leads:renderLeads, notes:renderNotes, resources:renderResources,
  templates:renderTemplates, lessons:renderLessons, finance:renderFinance, motivation:renderMotivation};
let currentPage = 'dashboard';

function followupsDueCount(){
  return S.clients.filter(c=>c.followup && c.followup<=todayKey() && !['Closed','Lost'].includes(c.status)).length;
}
function renderNav(){
  const due = followupsDueCount();
  $('#nav').innerHTML = NAV.map(g=>`
    <div class="nav-group">${g.group}</div>
    ${g.items.map(([id,label,ic])=>`
      <a class="nav-item ${currentPage===id?'active':''}" href="#" onclick="go('${id}');return false">
        ${icon(ic,16)}<span>${label}</span>
        ${id==='followups'&&due?`<span class="nav-count">${due}</span>`:''}
      </a>`).join('')}`).join('');
}
function go(page){
  if(!RENDER[page]) return;
  currentPage = page;
  $$('.page').forEach(p=>p.classList.remove('active'));
  RENDER[page]();                       // render fresh (data may have changed)
  $('#page-'+page).classList.add('active');
  $('#pageTitle').textContent = PAGE_TITLES[page];
  renderNav();
  window.scrollTo({top:0});
  $('#sidebar').classList.remove('open'); // close mobile drawer
}

/* ===== COMMAND PALETTE (⌘K) ===== */
const ACTIONS = [
  ['Log a call', 'phone', ()=>{ logCall(); if(currentPage==='dashboard') renderDashboard(); }],
  ['Log a demo', 'target', ()=>{ logDemo(); if(currentPage==='dashboard') renderDashboard(); }],
  ['Add a new lead', 'plus', ()=>{ go('crm'); openClient(); }],
  ['New note', 'note', ()=>{ go('notes'); addNote(); }],
  ['Add income / expense', 'dollar', ()=>go('finance')],
  ['Start a website audit', 'clipboard', ()=>go('audit')],
];
let cmdkIndex = 0, cmdkHits = [];
function openCmdk(){
  closeModal();
  const items = [
    ...NAV.flatMap(g=>g.items.map(([id,label,ic])=>({t:label, ic, hint:'Go to', run:()=>go(id)}))),
    ...ACTIONS.map(([t,ic,run])=>({t, ic, hint:'Action', run})),
  ];
  $('#cmdkRoot').innerHTML = `
    <div class="cmdk" id="cmdkVeil">
      <div class="cmdk-box">
        <div class="cmdk-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="cmdkInput" placeholder="Search pages and actions…" autocomplete="off" spellcheck="false">
          <kbd>esc</kbd>
        </div>
        <div class="cmdk-list" id="cmdkList"></div>
      </div>
    </div>`;
  $('#cmdkVeil').addEventListener('mousedown', e=>{ if(e.target.id==='cmdkVeil') closeCmdk(); });
  const input = $('#cmdkInput');
  const paint = () => {
    const q = input.value.trim().toLowerCase();
    cmdkHits = items.filter(x=>x.t.toLowerCase().includes(q));
    cmdkIndex = clamp(cmdkIndex, 0, Math.max(cmdkHits.length-1, 0));
    $('#cmdkList').innerHTML = cmdkHits.length
      ? `<div class="cmdk-label">${q?'Results':'Jump to'}</div>` + cmdkHits.map((x,i)=>`
        <div class="cmdk-item ${i===cmdkIndex?'sel':''}" onclick="cmdkHits[${i}].run();closeCmdk()"
             onmouseenter="cmdkIndex=${i};[...this.parentElement.querySelectorAll('.cmdk-item')].forEach((e,j)=>e.classList.toggle('sel',e===this))">
          ${icon(x.ic,15)}<span>${esc(x.t)}</span><span class="hint">${x.hint}</span>
        </div>`).join('')
      : `<div class="cmdk-empty">Nothing matches "${esc(input.value)}"</div>`;
  };
  input.addEventListener('input', ()=>{ cmdkIndex=0; paint(); });
  input.addEventListener('keydown', e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); cmdkIndex=clamp(cmdkIndex+1,0,cmdkHits.length-1); paint(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); cmdkIndex=clamp(cmdkIndex-1,0,cmdkHits.length-1); paint(); }
    else if(e.key==='Enter' && cmdkHits[cmdkIndex]){ cmdkHits[cmdkIndex].run(); closeCmdk(); }
  });
  paint();
  requestAnimationFrame(()=>input.focus());
}
function closeCmdk(){ $('#cmdkRoot').innerHTML=''; }

/* ===== GLOBAL KEYBOARD SHORTCUTS ===== */
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    $('#cmdkRoot').children.length ? closeCmdk() : openCmdk();
    return;
  }
  if(e.key==='Escape'){ closeCmdk(); closeModal(); return; }
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable) return;
  if(/^[1-9]$/.test(e.key)){
    const order = NAV.flatMap(g=>g.items.map(x=>x[0]));
    const p = order[+e.key-1];
    if(p) go(p);
  }
});

/* ===== TOPBAR / SHELL WIRING ===== */
$('#searchBtn').addEventListener('click', openCmdk);
$('#menuBtn').addEventListener('click', e=>{ e.stopPropagation(); $('#sidebar').classList.toggle('open'); });
document.addEventListener('click', e=>{           // tap outside closes mobile drawer
  const sb = $('#sidebar');
  if(sb.classList.contains('open') && !sb.contains(e.target) && e.target.id!=='menuBtn' && !e.target.closest('#menuBtn'))
    sb.classList.remove('open');
});
$('#todayDate').textContent = new Date().toLocaleDateString('en-AU',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
$('#streakNum').textContent = S.streak.count;
document.querySelector('#streakPill .lbl').textContent = S.streak.count===1 ? 'day streak' : 'day streak';

/* ===== BOOT ===== */
go('dashboard');
if(!S.seeded){
  S.seeded = true; save();
  setTimeout(()=>toast('Welcome to Northside HQ — press ⌘K to fly around'), 700);
}
</script>
</body>
</html>
